# Configuración oficial de SonarQube / SonarCloud para SysQuest Frontend
sonar.projectKey=sysquest-frontend
sonar.projectName=SysQuest Frontend
sonar.projectVersion=1.0.0

# Directorios de código fuente y pruebas
sonar.sources=lib
sonar.tests=test

# Mapeo de cobertura de pruebas LCOV
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Codificación de caracteres
sonar.sourceEncoding=UTF-8

# Exclusiones de cobertura: En Clean Architecture las pruebas unitarias se enfocan
# en Dominio e Infraestructura; la capa de presentación (UI/Widgets) se excluye
# del cálculo de cobertura unitaria.
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/main.dart,lib/presentation/**
sonar.exclusions=android/**,ios/**,web/**,windows/**,linux/**,macos/**,assets/**
